# =======================================================
# Routewise Application Configuration
# DB credentials and service endpoints use environment variable overrides
# =======================================================

spring.application.name=routewise-backend
server.port=${PORT:8080}

# Primary MySQL Database Configuration with SSL support for Cloud MySQL
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/routewise_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings (safe for cloud restarts - never drops tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# FastAPI Python Microservice Endpoint
routewise.microservice.url=${PYTHON_SERVICE_URL:${MICROSERVICE_URL:http://localhost:8000}}

# CORS Allowed Origins (Comma-separated list, e.g., https://my-routewise.vercel.app,http://localhost:3000)
routewise.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}

# Error Handling & Security (Hide internal stack traces and server info)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Logging configuration
logging.level.com.routewise=INFO
logging.level.org.springframework.web=INFO
