# =======================================================
# Routewise Application Configuration
# DB credentials use environment variable overrides with fallback defaults
# No hardcoded production secrets
# =======================================================

spring.application.name=routewise-backend
server.port=8080

# Primary MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/routewise_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# FastAPI Python Microservice Endpoint
routewise.microservice.url=${MICROSERVICE_URL:http://localhost:8000}

# Logging configuration
logging.level.com.routewise=INFO
logging.level.org.springframework.web=INFO
