<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="needle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Outer decorative compass ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="4"/>

  <!-- Compass Cardinal Ticks -->
  <line x1="256" y1="102" x2="256" y2="118" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="394" x2="256" y2="410" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="102" y1="256" x2="118" y2="256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="394" y1="256" x2="410" y2="256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Winding Path Ribbon -->
  <path d="M 140 330 C 180 250, 240 360, 310 270 C 340 230, 370 210, 390 190" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="14 10" opacity="0.85"/>

  <!-- Glowing Compass Needle -->
  <g transform="rotate(38 256 256)">
    <!-- North Pointer (Golden) -->
    <polygon points="256,120 280,240 256,256 232,240" fill="url(#needle)" filter="url(#shadow)"/>
    <!-- South Pointer (White/Ice) -->
    <polygon points="256,392 280,272 256,256 232,272" fill="#EDE9FE"/>
    <!-- Center Pivot Pin -->
    <circle cx="256" cy="256" r="18" fill="#1E1B4B"/>
    <circle cx="256" cy="256" r="8" fill="#FDE047"/>
  </g>

  <!-- Small Travel Stars -->
  <circle cx="160" cy="170" r="6" fill="#FDE047" opacity="0.9"/>
  <circle cx="370" cy="330" r="5" fill="#FDE047" opacity="0.8"/>
</svg>
